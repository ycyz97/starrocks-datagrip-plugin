<!DOCTYPE html>
<html lang="en"><head><title>concat</title></head><body>
<p>Concatenates two or more values as a string.</p>
<p><b>Syntax:</b> <code>CONCAT(expr1, expr2 [, ...])</code></p>
<p><b>Parameters:</b> Each argument is converted to a compatible string value.</p>
<p><b>Returns:</b> The concatenated string. If an argument is <code>NULL</code>, the result is <code>NULL</code>.</p>
<pre><code>SELECT CONCAT('Star', 'Rocks'); -- StarRocks</code></pre>
</body></html>
