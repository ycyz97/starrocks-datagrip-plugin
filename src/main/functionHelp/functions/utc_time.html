<html lang="en"><head><title>utc_time</title></head><body>
<h2>utc_time</h2>
<p>Returns the current UTC time as a value in 'HH:MM:SS'.</p>
<h3>Syntax</h3>
<pre><code>TIME UTC_TIME()</code></pre>
<h3>Examples</h3>
<pre><code>MySQL &gt; select utc_time();
+----------------+
| utc_time()     |
+----------------+
| 12:31:18       |
+----------------+</code></pre>
<h3>keyword</h3>
<p>UTC_TIME,UTC,TIME</p>
<p><b>Source:</b> <a href="https://github.com/StarRocks/starrocks/blob/main/docs/en/sql-reference/sql-functions/date-time-functions/utc_time.md">StarRocks documentation</a></p>
</body></html>
