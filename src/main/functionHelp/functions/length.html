<h2>length</h2>
<p>This function returns the length of a string (in bytes).</p>
<h3>Syntax</h3>
<pre><code>INT length(VARCHAR str)</code></pre>
<h3>Examples</h3>
<pre><code>MySQL &gt; select length(&quot;abc&quot;);
+---------------+
| length('abc') |
+---------------+
|             3 |
+---------------+</code></pre>
<h3>keyword</h3>
<p>LENGTH</p>
