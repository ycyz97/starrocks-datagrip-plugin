<h2>from_days</h2>
<p>Returns a date from 0000-01-01.</p>
<h3>Syntax</h3>
<pre><code>DATE FROM_DAYS(INT N)</code></pre>
<h3>Examples</h3>
<pre><code>MySQL &gt; select from_days(730669);
+-------------------+
| from_days(730669) |
+-------------------+
| 2000-07-03        |
+-------------------+</code></pre>
<h3>keyword</h3>
<p>FROM_DAYS,FROM,DAYS</p>
<p><b>Source:</b> <a href="https://github.com/StarRocks/starrocks/blob/main/docs/en/sql-reference/sql-functions/date-time-functions/from_days.md">StarRocks documentation</a></p>
