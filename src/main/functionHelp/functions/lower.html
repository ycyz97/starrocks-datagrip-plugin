<h2>lower</h2>
<p>Converts all strings in an argument to lower-case.</p>
<h3>Syntax</h3>
<pre><code>INT lower(VARCHAR str)</code></pre>
<h3>Examples</h3>
<pre><code>MySQL &gt; SELECT lower(&quot;AbC123&quot;);
+-----------------+
| lower('AbC123') |
+-----------------+
| abc123          |
+-----------------+</code></pre>
<h3>keyword</h3>
<p>LOWER</p>
