<!DOCTYPE html>
<html lang="en"><head><title>abs</title></head><body>
<p>Returns the absolute value of a numeric expression.</p>
<p><b>Syntax:</b> <code>ABS(x)</code></p>
<p><b>Parameters:</b> <code>x</code> is the numeric expression to evaluate.</p>
<p><b>Returns:</b> The absolute value, with the type derived from <code>x</code>.</p>
<pre><code>SELECT ABS(-42); -- 42</code></pre>
</body></html>
