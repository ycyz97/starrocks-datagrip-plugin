<h2>abs</h2>
<p>Returns the absolute value of a numeric expression.</p>
<h3>Syntax</h3>
<pre><code>ABS(x)</code></pre>
<h3>Parameters</h3>
<p><code>x</code>: the numeric expression to evaluate.</p>
<h3>Return value</h3>
<p>Returns the absolute value, with the type derived from <code>x</code>.</p>
<h3>Examples</h3>
<pre><code>SELECT ABS(-42);</code></pre>
<h3>keyword</h3>
<p>ABS</p>
<p><b>Source:</b> <a href="https://docs.starrocks.io/docs/sql-reference/sql-functions/">StarRocks documentation</a></p>
</body></html>
