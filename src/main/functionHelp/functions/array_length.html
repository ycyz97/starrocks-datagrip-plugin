<!DOCTYPE html>
<html lang="en"><head><title>array_length</title></head><body>
<p>Returns the number of elements in an array.</p>
<p><b>Syntax:</b> <code>ARRAY_LENGTH(array)</code></p>
<p><b>Parameters:</b> <code>array</code> is an array expression.</p>
<p><b>Returns:</b> An integer count. A <code>NULL</code> array returns <code>NULL</code>.</p>
<pre><code>SELECT ARRAY_LENGTH([10, 20, 30]); -- 3</code></pre>
</body></html>
